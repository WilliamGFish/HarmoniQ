[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "harmoniq-studio"
version = "0.1.0"
authors = [
  { name="HarmoniQ PicoEdge AI Team" },
]
description = "AutoML Studio for PicoEdge AI embedded library"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
]

[project.scripts]
harmoniq-studio = "harmoniq_studio:main"
